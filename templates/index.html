<!DOCTYPE html>
<html>
<head>
    <title>OpenSource Buddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    <div class="container">
        <h1>🚀 Welcome to OpenSource Buddy</h1>
        <form action="/search" method="POST" enctype="multipart/form-data">
            <p>Find the best open-source projects to contribute to!</p>
            <input type="text" id="topic" name="topic" placeholder="e.g. Python, AI, web dev">
            <button type="submit" name="task" value="project">Find Projects</button>
        </form>
        {% if result %}
        <div>
            {{ result|safe }}
        </div>
        {% endif %}
        
    </div>

   
</body>
</html>
